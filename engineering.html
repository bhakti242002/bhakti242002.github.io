<script>document.documentElement.classList.add('js');</script>
<style>
:root{
  --ink:#15151F; --ink-2:#4B4E5C; --ink-3:#767A8A; --rule:#E4E6ED; --soft:#F7F8FB;
  --blue:#1F5BFF; --blue-ink:#1A4BD6; --blue-soft:#9DB7FF; --blue-tint:#F2F5FF;
  --green:#00A676; --green-ink:#00805B; --green-tint:#EFF9F4;
  --orange:#FF6A13; --orange-ink:#C24A00; --orange-tint:#FFF5EC;
  --purple:#8B3DFF; --purple-ink:#6A28D9; --purple-tint:#F6F1FF;
  --amber:#F2A500; --red:#E5313D; --gray:#A3A9B8;
  --font:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:80px;}
body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.6 var(--font);-webkit-font-smoothing:antialiased;}
h1,h2,h3,p,ul,figure{margin:0;}
ul{padding:0;list-style:none;}
a{color:inherit;}
button{font:inherit;}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px;}
.skip{position:absolute;left:16px;top:-70px;z-index:50;padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff;text-decoration:none;}
.skip:focus{top:16px;}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:clamp(20px,5vw,56px);padding-right:clamp(20px,5vw,56px);}

/* nav */
.nav{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule);}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;}
.brand{font-size:18px;font-weight:800;text-decoration:none;}
.nav-links{display:flex;gap:clamp(14px,2.4vw,30px);}
.nav-links a{font-weight:600;font-size:15.5px;color:var(--ink-2);text-decoration:none;transition:color .2s;}
.nav-links a:hover,.nav-links a.on{color:var(--ink);}
.prog{position:absolute;left:0;bottom:-1px;width:100%;height:3px;background:linear-gradient(90deg,var(--blue) 0 25%,var(--green) 25% 50%,var(--orange) 50% 75%,var(--purple) 75% 100%);transform-origin:0 50%;transform:scaleX(var(--s,0));}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;text-decoration:none;transition:transform .15s,background-color .15s,box-shadow .15s;}
.btn:hover{transform:translateY(-2px);}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.btn.c{background:var(--c-ink);}
.btn.white{background:#fff;color:var(--ink);}
.btn.white-line{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);}

/* hero */
.hero{padding:clamp(48px,7vw,96px) 0 clamp(52px,7vw,92px);}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:center;}
.name{font-size:clamp(46px,6.2vw,80px);font-weight:800;line-height:1;letter-spacing:-.025em;}
.role{margin-top:18px;max-width:40ch;font-size:clamp(20px,2vw,25px);font-weight:600;line-height:1.38;color:var(--ink-2);}
.summary{margin-top:18px;max-width:60ch;font-size:18px;color:var(--ink-2);}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;}
.avail{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:15px;color:var(--ink-2);}
.pulse{position:relative;width:10px;height:10px;flex:none;border-radius:50%;background:var(--green);}
.pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--green);opacity:0;animation:ring 2.4s ease-out infinite;}
@keyframes ring{0%{transform:scale(.5);opacity:.8;}100%{transform:scale(1.5);opacity:0;}}
.js .hero .rise{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.75,.25,1) forwards;}
.js .hero .rise:nth-child(2){animation-delay:.08s;} .js .hero .rise:nth-child(3){animation-delay:.16s;} .js .hero .rise:nth-child(4){animation-delay:.24s;} .js .hero .rise:nth-child(5){animation-delay:.32s;}
@keyframes rise{to{opacity:1;transform:none;}}
.stats{display:grid;grid-template-columns:1fr 1fr;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);overflow:hidden;}
.stat{position:relative;padding:26px 24px 24px;}
.stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--rule);}
.stat:nth-child(odd){border-right:1px solid var(--rule);}
.stat::before{content:"";position:absolute;left:24px;top:0;width:36px;height:4px;border-radius:0 0 3px 3px;background:var(--c);}
.stat b{display:block;font-size:clamp(34px,3.6vw,46px);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--c-ink);font-variant-numeric:tabular-nums;}
.stat span{display:block;margin-top:10px;font-size:15px;line-height:1.4;color:var(--ink-2);}

/* section headings */
.s-head{padding-top:clamp(56px,7vw,96px);padding-bottom:clamp(20px,3vw,32px);}
.s-title{font-size:clamp(32px,3.6vw,46px);font-weight:800;line-height:1.05;letter-spacing:-.02em;}
#projects{padding-top:clamp(8px,2vw,24px);}
.s-sub{margin-top:10px;max-width:60ch;font-size:18px;color:var(--ink-2);}

/* featured projects */
.feature{background:var(--tint);padding:clamp(48px,6vw,84px) 0;}
.f-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px 32px;}
.f-title{position:relative;padding-left:20px;font-size:clamp(30px,3.3vw,42px);font-weight:800;line-height:1.08;letter-spacing:-.02em;}
.f-title::before{content:"";position:absolute;left:0;top:.1em;bottom:.1em;width:6px;border-radius:3px;background:var(--c);}
.f-one{margin-top:8px;max-width:60ch;font-size:19px;font-weight:600;color:var(--c-ink);}
.built-list{margin-top:24px;max-width:900px;}
.built-list li{position:relative;margin-top:10px;padding-left:22px;font-size:17.5px;color:var(--ink-2);}
.built-list li::before{content:"";position:absolute;left:0;top:.7em;width:10px;height:3px;border-radius:2px;background:var(--c);}
.built-list strong{font-weight:700;color:var(--ink);}
.f-built{margin-top:8px;font-size:14.5px;color:var(--ink-3);}
.f-actions{display:flex;flex-wrap:wrap;gap:10px;}
.diagram{margin-top:32px;padding:clamp(14px,2.4vw,26px);border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px rgba(21,21,31,.07);}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.flow{display:block;width:100%;min-width:760px;height:auto;}
.d-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 24px;margin-top:14px;}
.d-foot p{max-width:64ch;font-size:15.5px;color:var(--ink-2);}
.swipe{display:none;margin-top:6px;font-size:13.5px;color:var(--ink-3);}
.toggle{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;transition:background-color .2s;}
.toggle[aria-pressed="true"]{background:var(--red);}
.line{fill:none;stroke-width:12;stroke-linecap:round;}
.l-blue{stroke:var(--blue);} .l-green{stroke:var(--green);} .l-orange{stroke:var(--orange);}
.spur{fill:none;stroke:var(--blue-soft);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;}
.branch{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
.b-pass{stroke:var(--green);} .b-none{stroke:var(--gray);} .b-slow{stroke:var(--amber);} .b-fail{stroke:var(--red);}
.ghost{fill:none;stroke:none;}
.flow .st{fill:#fff;stroke:var(--ink);stroke-width:4;}
.flow .term{fill:#fff;stroke:var(--ink);stroke-width:5;transition:stroke .3s;}
.flow .claude{stroke:var(--blue-ink);}
.bend{fill:#fff;stroke-width:5;}
.be-pass{stroke:var(--green);} .be-none{stroke:var(--gray);} .be-slow{stroke:var(--amber);} .be-fail{stroke:var(--red);}
.sl{font:700 18px var(--font);fill:var(--ink);}
.ss{font:500 13.5px var(--font);fill:var(--ink-2);}
.bl{font:700 18px var(--font);}
.bl-pass{fill:var(--green-ink);} .bl-none{fill:#5E6475;} .bl-slow{fill:#9A6600;} .bl-fail{fill:#C4202C;}
.bp{font-weight:800;}
.pt{stroke:var(--ink);stroke-width:2;}
.pk{stroke:#fff;stroke-width:2.5;}
.pk-blue{fill:var(--blue-ink);} .pk-orange{fill:var(--orange-ink);} .pk-spur{fill:var(--blue-soft);stroke:var(--blue-ink);stroke-width:2;}
.offsign{opacity:0;transition:opacity .3s;}
.offsign rect{fill:var(--red);}
.offsign text{font:700 15px var(--font);fill:#fff;}
.ai-off .spur{stroke:#CDD1DB;stroke-dasharray:10 9;}
.ai-off .pk-spur{visibility:hidden;}
.ai-off .offsign{opacity:1;}
.ai-off .claude{stroke:#B8BDC9;}
.f-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(32px,5vw,64px);align-items:start;margin-top:44px;}
.lead{max-width:54ch;font-size:19px;line-height:1.55;}
.mini{margin:30px 0 0;font-size:20px;font-weight:700;}
.points{position:relative;margin-top:14px;padding-left:32px;}
.points::before{content:"";position:absolute;left:8px;top:10px;bottom:14px;width:5px;border-radius:3px;background:var(--c);opacity:.55;}
.points li{position:relative;padding:4px 0 14px;}
.points li::before{content:"";position:absolute;left:-30px;top:9px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--c-ink);}
.points b{display:block;font-size:17.5px;font-weight:700;}
.points p{margin-top:2px;color:var(--ink-2);}
.results{padding:6px 22px 4px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px rgba(21,21,31,.07);}
.results h4{margin:0;padding:14px 0 6px;font-size:15px;font-weight:700;color:var(--ink-3);}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0;border-top:1px solid var(--rule);}
.rk{display:flex;align-items:center;gap:10px;color:var(--ink-2);}
.rv{font-size:24px;font-weight:800;line-height:1.1;color:var(--c-ink);text-align:right;font-variant-numeric:tabular-nums;}
.dot{width:11px;height:11px;flex:none;
